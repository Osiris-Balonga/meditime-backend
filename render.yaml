services:
  - type: web
    name: meditime-backend
    runtime: node
    plan: free
    region: frankfurt
    repo: https://github.com/Osiris-Balonga/meditime-backend
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build && npm run db:deploy
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGINS
        value: http://localhost:5173,http://localhost:3000
      - key: SESSION_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
